name: Daily AI Post Automation

on:
  schedule:
    - cron: '0 0 * * *' # 매일 한국 시간 오전 9시 (UTC 00:00)
  workflow_dispatch: # 수동 실행 버튼 추가

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @google/generative-ai

      - name: Generate Daily Post
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          INSTAGRAM_BUSINESS_ID: ${{ secrets.INSTAGRAM_BUSINESS_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: node scripts/generate-daily-post.mjs

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add src/data/product.json src/data/curation.json promo_content.txt
          git commit -m "Automated daily post: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push

      - name: Send Discord Notification
        run: |
          PROMO_TEXT=$(cat promo_content.txt 2>/dev/null | head -c 1800 || echo "오늘의 상품 데이터가 생성되었습니다.")
          PAYLOAD=$(jq -n --arg text "[Money-Maker AI] 오늘의 홍보글 리포트\n\n${PROMO_TEXT}" '{"content": $text}')
          curl -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
